<html lang="en">
<head>

<title>Power feed — 3D view</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2026; color: #e6e8eb;
               font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .card { position: absolute; background: rgba(20,22,27,.9); border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.35); }

  #ui button { margin: 2px 4px 2px 0; padding: 3px 8px; border-radius: 6px; border: 1px solid #4a505b;
               background: #2a2e36; color: #e6e8eb; cursor: pointer; }
  #info { top: 12px; right: 12px; width: 320px; max-height: calc(100% - 60px); overflow: auto; padding: 14px 16px; }
  #info h2 { font-size: 16px; margin: 0 0 2px; }
  #info .sub { color: #9aa3ad; font-size: 12px; margin-bottom: 10px; }
  #info p { margin: 6px 0; }
  #info table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 12px; }
  #info td { padding: 2px 0; vertical-align: top; }
  #info td:first-child { color: #9aa3ad; width: 84px; }
  #info .hint { color: #9aa3ad; }
  #status { position: absolute; bottom: 10px; left: 12px; color: #9aa3ad; }
  #hint { position: absolute; bottom: 10px; right: 12px; color: #9aa3ad; }
</style>

    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<div id="ui" class="card">
  <h1>Power feed — what exists so far</h1>
  <label><input type="checkbox" data-group="mill" checked> Power feed on the mill (one box)</label>
  <label><input type="checkbox" data-group="clutch" checked> Clutch, exploded</label>
  <div class="sep"></div>
  <label><input type="checkbox" id="shell" checked> Housing shell</label>
  <label><input type="checkbox" id="hood" checked> Hood (top + controls)</label>
  <label><input type="checkbox" id="xray"> X-ray (see inside)</label>
  <label><input type="checkbox" id="millref" checked> Mill table-end stand-in</label>
  <label><input type="checkbox" id="coil"> Clutch coil ON (engaged)</label>
  <label><input type="checkbox" id="door"> Open the bottom door</label>
  <div class="sep"></div>
  <button data-view="all">All</button><button data-view="mill">Power feed</button><button data-view="clutch">Clutch</button>
</div>
<div id="info" class="card"><h2>Click any part</h2><p class="hint">Click a part to see what it is and what it does. On the
  circuit board, click a component to identify it. Click empty space to clear.</p></div>
<div id="status">loading…</div>
<div id="hint">click = identify · drag = rotate · right-drag = pan · scroll = zoom</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { STLLoader } from "three/addons/loaders/STLLoader.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// ---------------------------------------------------------------- what every part is: [title, kind / material, description]
const INFO = {
  mill_reference: ["Mill table end (stand-in)", "Reference only", "A box standing in for the SIEG X3.5D's left table end, leadscrew bracket and leadscrew. Its numbers are placeholders until you measure the mill (docs/mill.md)."],
  standoffs: ["Standoffs", "Steel or 6061, 4 pcs", "Hold the plate off the table end and form the belt chamber. M6 screws go through them into the table end (positions are placeholders until measured)."],
  plate: ["Main plate", "6061 aluminium, 28 mm, CNC", "The backbone: carries the leadscrew stub bearings, the clutch/motor module (in a slot open to the bottom edge, so the module slides up into it from below; slotted for belt tension) and the encoder, and closes the back of the housing. Corners rounded to match the printed housing."],
  stub_shaft: ["Leadscrew stub", "Steel Ø15, lathe", "Runs in the two 6002 bearings in the plate. Its tongue drives the leadscrew through the Oldham disc; the 40T pulley sits on it and the encoder on its outer end."],
  oldham_disc: ["Oldham disc", "Steel 1045 or bronze, greased", "Couples the stub to the leadscrew's drive slot: a tongue on one face, a cross slot on the other, so the plate doesn't have to sit exactly on the leadscrew axis."],
  pulley_40T: ["40T pulley", "HTD-5M for 15 mm belt (buy, re-bore Ø15)", "Big pulley on the leadscrew stub. With the 20T pulley it gives a 2:1 reduction: twice the torque at the leadscrew."],
  pulley_20T: ["20T pulley", "HTD-5M for 15 mm belt (buy, re-bore Ø12)", "Small pulley on the clutch output shaft."],
  belt: ["Timing belt", "HTD 295-5M-15 (buy)", "Connects the clutch output to the leadscrew stub, 2:1. Tensioned by the drawbolt below the module."],
  belt_guard: ["Belt guard", "3D print (PETG)", "A cup closing the belt chamber between the table end and the plate, so chips and fingers stay out of the belt."],
  bearings_6002: ["Stub bearings", "2× 6002-2RS, spacer tube, circlips", "Carry the leadscrew stub in the plate. The inner bearing locates the stub (shoulder + circlip); the outer one floats."],
  encoder: ["Output encoder", "LPD3806-600BM (buy)", "Measures the leadscrew stub's real rotation (2400 counts per turn). The TMC5160 compares it with the motor to catch stalls, belt slip and whether the clutch really engaged."],
  encoder_disc: ["Encoder adapter disc", "6061, 5 mm", "Holds the encoder on three posts, outside the bearing bore."],
  encoder_posts: ["Encoder posts", "M3 hex standoffs", "Space the encoder disc off the plate."],
  encoder_coupling: ["Flexible coupling", "6 × 8 mm (buy)", "Connects the stub's Ø8 end to the encoder's Ø6 shaft and absorbs small misalignment."],
  tension_block: ["Belt-tension block", "Steel, 72 × 14 × 12", "Bridges the plate's slot under the module (2× M5, one in each leg). An M4 drawbolt through it pulls the clutch/motor module away from the leadscrew to tension the belt; then the four module bolts are locked. Reached through a hole in the bottom door."],
  clutch_field_housing: ["Clutch field housing", "Low-carbon steel, lathe", "Stationary magnet body bolted to the motor flange. Holds the coil; its poles pull the armature."],
  clutch_coil: ["Clutch coil", "~850 turns 0.32 mm Cu, ≈24 Ω", "The electromagnet: 1.5 A pull-in, then ≈0.25 A hold from the PCB's clutch driver. No power = clutch released (fail-safe)."],
  clutch_rotor: ["Clutch rotor", "Low-carbon steel, lathe + CNC teeth", "Glued (Loctite 641) onto the motor shaft. Its face carries 30 radial teeth and the magnetic poles."],
  clutch_armature: ["Clutch armature", "Low-carbon steel, lathe + CNC teeth", "Shown released (coil off): its 3 return springs pull it back against the hub, 1.25 mm off the rotor, so the teeth don't touch and the handwheel turns freely. With the coil on (tick 'Clutch coil ON') the magnet pulls it 1.1 mm onto the rotor, the teeth mesh and the motor drives the leadscrew. Three pins pressed into it slide in the hub: they turn the hub and keep it centred."],
  clutch_hub: ["Clutch output hub", "6061, with 3 bronze bushes", "On the output shaft. The armature's 3 drive pins slide in its bronze bushes (that is how the armature turns the hub), and its face is the armature's released stop."],
  clutch_output_shaft: ["Clutch output shaft", "Ø12 h6 ground rod", "Runs in the cover's two 6001 bearings and carries the 20T pulley."],
  clutch_cover: ["Clutch cover", "6061 (non-magnetic), lathe", "Closes the clutch, carries the output bearings and bolts the whole module to the plate."],
  motor: ["Stepper motor", "NEMA 23, 3 N·m, 4.2 A (yours)", "Drives the feed through the clutch and the 2:1 belt; the TMC5160 on the PCB drives it."],
  psu: ["36 V power supply", "Mean Well LRS-75-36, 75 W (buy)", "Mains in, 36 V out for the motor driver, clutch and logic. Sits in the earthed aluminium mains tray under the drive, screwed through the tray floor (2× M3, max 3 mm into the case). Only the 36 V pair leaves the tray, through a grommet to J1 on the PCB."],
  mains_tray: ["Mains tray", "1.5 mm aluminium, folded, earthed", "Metal box holding the power supply and closing off everything at mains voltage. It goes in from below: its two floor tabs sit in rebates in the plate's bottom edge and 2× M4 go up into the plate (that is also the earth bond). The IEC inlet clips into its end face from outside. Earth test after assembly: ≤ 0.1 Ω from the inlet's earth pin to the plate."],
  mains_tray_lid: ["Mains tray lid", "1.5 mm aluminium, folded", "Closes the mains zone over the PSU terminals. Its edge folds down so the zone is closed all round; 4× M3 into closed-end rivnuts, so no screw tips stick into the mains zone. Line the inside of the fold with 0.4 mm Nomex/Formex."],
  mains_inlet: ["AC inlet", "IEC C14 snap-in with fuse + switch (buy)", "Where the mains cord plugs in, in the end wall. Built-in on/off switch and fuse holder: T 2 A ceramic 5×20 for 230 V (T 3.15 A for 120 V). L and N go switched and fused to the PSU; PE goes to the tray."],
  usb_path: ["USB-C to J4", "Adafruit #6069 panel extension + 90° USB-C adapter", "The programming port's way to the PCB: the panel end (M12 thread, Ø18 flange) in the end wall, and at the board a 90° adapter in J4 that takes the extension's straight 38 mm male plug from above (J4 is only 29 mm from the wall, too close for the plug to go in straight)."],
  fx_clutch: ["Clutch fasteners", "ISO screws, nuts, set screws, circlips; threads shown", "4× M5×30 SHCS + nuts (housing to the motor flange), M3×8 SHCS (rotor onto the motor shaft), 6× M4×8 countersunk ISO 10642 (cover to housing, flush), 2× M5×6 set screws (hub), 2× DIN 472-28 and 1× DIN 471-12 circlips, and the threads of every tapped hole."],
  fx_plate: ["Plate fasteners", "ISO screws, washers, circlips; threads shown", "4× M5×35 SHCS + washers from the belt chamber into the clutch cover (module), M4×30 SHCS drawbolt (belt tension), 2× M5×20 (tension block), 4× M6×70 SHCS in counterbores through the standoffs into the table end, encoder M3 screws, 2× DIN 472-32 + DIN 471-15 circlips (stub bearings), and the plate's tapped-hole threads."],
  fx_housing: ["Housing fasteners", "ISO 10642 M3×8, M3 heat-set inserts, M3 button heads", "Every countersunk M3×8 holding the shell and hood to the plate (tapped) or to heat-set inserts in the shell's rails, the 4 PCB screws into inserts in the bosses, and the bottom door's 2 screws."],
  fx_mains: ["Mains tray fasteners", "ISO 7380 button heads, serrated washers, closed-end rivnuts", "2× M4×8 up through the tray's tabs into the plate with a serrated lock washer between tab and plate (the earth bond), 2× M3×4 (power supply), 4× M3×6 lid screws into closed-end M3 rivnuts."],
  fx_motor_reference: ["Motor-side fasteners", "M5 nuts, motor shaft thread", "The 4 M5 nuts behind the motor flange and the M3 thread in the motor shaft end (exploded view)."],
  fx_field_housing: ["Housing fasteners (clutch)", "4× M5×30 SHCS, 6 tapped M4", "Motor screws and the housing's radial M4 threads (exploded view)."],
  fx_rotor: ["Rotor screw", "M3×8 SHCS", "Holds the rotor's shoulder on the motor shaft end (exploded view)."],
  fx_output_hub: ["Hub set screws", "2× M5×6 ISO 4026", "On the output shaft, one on its flat (exploded view)."],
  fx_output_shaft: ["Shaft circlip", "DIN 471-12", "Locates the output shaft against the inner bearing (exploded view)."],
  fx_cover: ["Cover fasteners", "6× M4×8 countersunk, circlips, tapped M5/M4", "Radial screws into the housing, DIN 472-28 circlips, the front wall's M5 and drawbolt M4 threads (exploded view)."],
  door_pin: ["Door hinge pin", "Ø3 × 180 silver steel rod (or a drill blank)", "The bottom door's axis, along the back bottom edge. Push it in from the end-wall end: it slides through every knuckle (Ø3.2) and only its last 30 mm press into the plate-end knuckle (Ø2.95). The door's knuckles turn on it. Punch it out from the plate end to take the door off."],
  door: ["Bottom door", "3D print (PETG), one piece", "The whole floor of the box, rounded bottom edges included. Open it (2 screws on the front side, it swings down on a Ø3 steel pin hinge along the back edge and hangs beside the box) and the clutch/motor module and the mains tray go in and come out from below; the PCB goes in from the top. Tick 'Open the bottom door' to see it open."],
  shell: ["Housing shell", "3D print (PETG), one piece", "Back, end and lower-front walls with the PCB rails (no floor: that is the bottom door). Prints standing on its end wall on a Prusa MK3S, and overlaps and screws onto the plate edges. End wall: the AC inlet, a cable gland for the limit switches, USB-C, BOOT/RESET and the SWD port. Vents in the bottom and high on the back."],
  hood: ["Hood", "3D print (PETG), one piece", "Top + control strip in one L-shaped print with engraved labels. Lift it off and the whole PCB is exposed from above."],
  control_estop: ["E-stop", "22 mm mushroom, NC contact (buy)", "Hardware emergency stop: opening its loop cuts the motor-driver enable and the clutch drive in hardware, whatever the firmware does. Latches until released and the switch is centred."],
  control_toggle: ["Direction switch", "ON-OFF-ON toggle (buy)", "LEFT / STOP / RIGHT. Centre: motor stopped and clutch released, so the handwheel turns freely. Left/right: the clutch engages and the table feeds that way."],
  control_rapid: ["Rapid button", "16 mm momentary (buy)", "Hold for rapid traverse in the selected direction."],
  control_dial: ["Speed dial", "EC11 encoder with push (buy)", "Turn to set the feed in mm/min; press to switch fine/coarse steps; long-press while stopped for the settings menu."],
  control_oled: ["Display", "1.3\" SH1106 OLED (buy)", "Shows the feed rate, the state (READY, RUNNING, faults), RAPID / LIMIT and the 36 V bus voltage."],
  control_adapter: ["Panel adapter board", "Small PCB with a 2×7 IDC header", "Collects the switches, dial and display onto one ribbon cable down to J6 on the main PCB."],
  field_housing: ["Clutch field housing", "Low-carbon steel, lathe", "Stationary magnet body with the coil cavity (exploded view)."],
  coil_bobbin: ["Clutch coil", "~850 turns 0.32 mm Cu", "The electromagnet (exploded view)."],
  rotor: ["Clutch rotor", "Low-carbon steel", "On the motor shaft: toothed face and magnetic poles (exploded view)."],
  armature: ["Clutch armature", "Low-carbon steel", "Moves 1.1 mm to mesh its teeth with the rotor; the 3 drive pins are pressed into it (exploded view)."],
  drive_pins: ["Drive pins", "Ø6 h6 silver steel × 25, 3 pcs", "Pressed into the armature, they slide in the hub's bronze bushes: they carry the torque (≈71 N each at the 4.5 N·m cam-out torque) and keep the armature centred. E-clip groove at the end."],
  return_springs: ["Return springs", "0.8 mm wire, OD 9, ≈2.5 N/mm, 3 pcs", "On the drive pins behind the hub, between the bronze bush (in the hub) and a washer held by an E-clip on the pin's end. They push that washer away from the hub, so they pull the pin and the armature back onto the hub: ≈24 N when released, ≈32 N engaged. No power, clutch open."],
  spring_retainers: ["Spring retainers", "3× M6 washer (ISO 7089) + 3× E-clip DIN 6799 RS5", "What keeps each spring compressed: the E-clip snaps sideways into the groove 1 mm from the pin's end and holds the washer the spring pushes against. No screws."],
  bushes: ["Bronze bushes", "Sintered bronze 6 × 10 × 8, 3 pcs", "Pressed into the hub; the drive pins slide in them."],
  clutch_pins: ["Clutch drive pins", "Ø6 silver steel, 3 pcs, + washers and E-clips", "Bonded into the armature, they slide in bronze bushes in the hub: they turn the hub and keep the armature centred. The washer and E-clip at each pin's far end are what the return spring pushes on."],
  clutch_springs: ["Clutch return springs", "3 pcs, 0.8 mm wire, OD 9, ≈2.5 N/mm", "Behind the hub, between the hub and the washer on each pin's far end. They push the washer away from the hub, so they PULL the pin and the armature back onto the hub, away from the rotor: clutch off. Coil on, the magnet pulls the armature 1.1 mm toward the rotor and the springs get SHORTER (8.7 → 7.6 mm), pushing back harder (8 → 10.7 N each)."],
  clutch_bushes: ["Bronze bushes", "Sintered bronze 6 × 10 × 8, 3 pcs", "Pressed into the hub; the drive pins slide in them."],
  output_hub: ["Clutch output hub", "6061 + 3 bronze bushes", "On the output shaft; the armature's pins slide in it and its face is the armature's released stop (exploded view)."],
  output_shaft: ["Clutch output shaft", "Ø12 h6", "Exploded view."],
  bearings: ["Clutch bearings", "2× 6001-2RS, spacers, circlips", "Carry the output shaft in the cover (exploded view)."],
  cover: ["Clutch cover", "6061", "Exploded view."],
  motor_reference: ["Motor flange (reference)", "NEMA 23", "Where the clutch bolts on (exploded view)."],
};

// ---------------------------------------------------------------- scene
const M = "../";
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d2026);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 1, 20000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x404048, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(400, -600, 900); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.6); fill.position.set(-600, 400, 300); scene.add(fill);
const grid = new THREE.GridHelper(2000, 40, 0x3a3f48, 0x2a2e35); grid.rotation.x = Math.PI / 2; grid.position.z = -160;
scene.add(grid);

const groups = {};
for (const g of ["mill", "clutch"]) { groups[g] = new THREE.Group(); scene.add(groups[g]); }
groups.mill.rotation.x = Math.PI / 2;            // feed_unit.py frame (Y up) -> Z up
groups.clutch.position.set(-300, 0, -60);

const housings = [];
const tagged = { shell: [], hood: [], millref: [], armature: [], springs: [] };
// the bottom door hangs on a pivot group whose origin is its hinge axis (from feed_unit.py's layout file)
const doorPivot = new THREE.Group();
const STROKE = 1.1;   // clutch armature travel (clutch.py p.stroke); the CAD exports it engaged
const stl = new STLLoader();
let pending = 0, loaded = 0;
const status = document.getElementById("status");
function tick() { status.textContent = loaded < pending ? `loading ${loaded}/${pending}…` : `${loaded} parts loaded`; }

function part(group, path, color, opts = {}) {
  pending++; tick();
  const key = path.split("/").pop().replace(".stl", "");
  stl.load(M + path, geo => {
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ color, metalness: opts.metal ?? 0.35, roughness: opts.rough ?? 0.5, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData.key = key;
    if (opts.dz) mesh.position.z = opts.dz;
    if (opts.housing) housings.push(mesh);
    if (opts.tag) tagged[opts.tag].push(mesh);
    (opts.pivot || groups[group]).add(mesh);
    loaded++; tick(); applyToggles();
  }, undefined, () => { loaded++; status.textContent = "missing: " + path; });
}

const F = "feed_unit/out/";
part("mill", F + "mill_reference.stl", 0x4a4f57, { metal: 0.1, rough: 0.9, tag: "millref" });
part("mill", F + "standoffs.stl", 0x9aa3ad);
part("mill", F + "plate.stl", 0xb8c2cc);
part("mill", F + "stub_shaft.stl", 0xd9dde2, { metal: 0.8, rough: 0.3 });
part("mill", F + "oldham_disc.stl", 0xb08d57, { metal: 0.7 });
part("mill", F + "pulley_40T.stl", 0xc0c6cc, { metal: 0.7 });
part("mill", F + "pulley_20T.stl", 0xc0c6cc, { metal: 0.7 });
part("mill", F + "belt.stl", 0x222222, { metal: 0, rough: 0.9 });
part("mill", F + "belt_guard.stl", 0xe07b39, { metal: 0, rough: 0.7, housing: true });
part("mill", F + "bearings_6002.stl", 0xe0b050, { metal: 0.8 });
part("mill", F + "encoder.stl", 0x333333);
part("mill", F + "encoder_disc.stl", 0x9fb4c8);
part("mill", F + "encoder_posts.stl", 0xd4b24c, { metal: 0.8 });
part("mill", F + "encoder_coupling.stl", 0x3a6fb0);
part("mill", F + "tension_block.stl", 0x707880);
part("mill", F + "clutch_field_housing.stl", 0x8a8f99, { housing: true });
part("mill", F + "clutch_cover.stl", 0xc9d1d9, { housing: true });
part("mill", F + "clutch_rotor.stl", 0xa9b4c2, { metal: 0.7 });
part("mill", F + "clutch_armature.stl", 0x7d8fa6, { metal: 0.7, tag: "armature" });
part("mill", F + "clutch_hub.stl", 0x9aa7b5, { metal: 0.7 });
part("mill", F + "clutch_pins.stl", 0x3b3f46, { metal: 0.8, tag: "armature" });
part("mill", F + "clutch_springs.stl", 0x2f6fd6, { metal: 0.6, tag: "springs" });
part("mill", F + "clutch_bushes.stl", 0xb5823a, { metal: 0.6 });
part("mill", F + "clutch_output_shaft.stl", 0xcfd6dd, { metal: 0.8, rough: 0.3 });
part("mill", F + "clutch_coil.stl", 0xc87533, { metal: 0.6 });
part("mill", F + "motor.stl", 0x3d3f44, { housing: true });
part("mill", F + "psu.stl", 0x5b8fd0, { metal: 0.5, rough: 0.5 });
part("mill", F + "mains_tray.stl", 0xa7b0ba, { metal: 0.7, rough: 0.4, housing: true });
part("mill", F + "mains_tray_lid.stl", 0xb9c2cb, { metal: 0.7, rough: 0.4, housing: true });
part("mill", F + "mains_inlet.stl", 0x1e1e1e, { metal: 0.1, rough: 0.7 });
// every screw, nut, washer, set screw, circlip, insert and rivnut, with real ISO threads (also in the tapped holes)
for (const g of ["clutch", "plate", "housing", "mains"])
  part("mill", F + "fx_" + g + ".stl", 0x8c939b, { metal: 0.9, rough: 0.35 });
part("mill", F + "usb_path.stl", 0x3a3a3a, { metal: 0.2, rough: 0.6 });
part("mill", F + "door_pin.stl", 0x9aa0a6, { metal: 0.9, rough: 0.3 });
part("mill", F + "door.stl", 0xe0dccf, { metal: 0, rough: 0.7, housing: true, tag: "shell", pivot: doorPivot });
part("mill", F + "shell.stl", 0xe8e4da, { metal: 0, rough: 0.7, housing: true, tag: "shell" });
part("mill", F + "hood.stl", 0xf0ece2, { metal: 0, rough: 0.7, housing: true, tag: "hood" });
for (const c of ["estop", "toggle", "rapid", "dial", "oled", "adapter"])
  part("mill", F + "control_" + c + ".stl", c === "oled" ? 0x203040 : c === "adapter" ? 0x2f7a3a : 0xc0392b, { metal: 0.1, rough: 0.6, tag: "hood" });

const C = "clutch/out/";
const ex = [["motor_reference", 0x555555, -40], ["field_housing", 0x8a8f99, 0], ["coil_bobbin", 0xc87533, -25],
            ["rotor", 0xa9b4c2, 25], ["armature", 0x7d8fa6, 55], ["drive_pins", 0x3b3f46, 55],
            ["output_hub", 0x9aa7b5, 100], ["bushes", 0xb5823a, 100], ["return_springs", 0x2f6fd6, 112], ["spring_retainers", 0xd4b24c, 126], ["output_shaft", 0xcfd6dd, 130],
            ["bearings", 0xe0b050, 150], ["cover", 0xc9d1d9, 175]];
for (const [n, col, dz] of ex) part("clutch", C + n + ".stl", col, { dz, metal: 0.6, housing: n === "cover" });
// each part's own fasteners, exploded with it
for (const [n, , dz] of ex.filter(e => ["motor_reference", "field_housing", "rotor", "output_hub", "output_shaft", "cover"].includes(e[0])))
  part("clutch", C + "fx_" + n + ".stl", 0x8c939b, { dz, metal: 0.9, rough: 0.35 });

// ---------------------------------------------------------------- the KiCad PCB, placed from feed_unit.py's layout file
let layout = { pcb_x0: -50, pcb_y: -33, pcb_w0: 129 }, pcbParts = [];
pending++; tick();
(async () => {
  try { layout = await (await fetch(M + F + "viewer_layout.json")).json(); } catch (e) { /* keep the defaults */ }
  if (layout.door_axis_x !== undefined) {         // pivot on the hinge axis (along W); the door mesh is offset back
    doorPivot.position.set(layout.door_axis_x, layout.door_axis_y, 0);
    doorPivot.userData.ready = true;
  }
  groups.mill.add(doorPivot); applyToggles();
  try { pcbParts = await (await fetch("out/pcb_parts.json")).json(); } catch (e) { pcbParts = []; }
  new GLTFLoader().load(M + "viewer/out/pcb.glb", gltf => {
    // kicad-cli GLB: metres, (x, up, y_pcb). The board lies flat above the motor: x = x0 + px, y = y_board + h, W = w0 + py
    const pcb = gltf.scene;
    pcb.matrixAutoUpdate = false;
    pcb.matrix.set(1000, 0, 0, layout.pcb_x0, 0, 1000, 0, layout.pcb_y, 0, 0, 1000, layout.pcb_w0, 0, 0, 0, 1);
    pcb.traverse(o => { o.userData.key = "pcb"; });
    groups.mill.add(pcb);
    loaded++; tick();
  }, undefined, () => { loaded++; status.textContent = "missing viewer/out/pcb.glb: run mechanical/viewer/build.sh"; });
})();

// ---------------------------------------------------------------- toggles, framing
const ids = ["xray", "shell", "hood", "millref", "coil", "door"].map(i => document.getElementById(i));
const [xray, shellCb, hoodCb, millref, coil, doorCb] = ids;
function applyToggles() {
  for (const m of housings) {
    m.material.transparent = xray.checked; m.material.opacity = xray.checked ? 0.18 : 1; m.material.depthWrite = !xray.checked;
  }
  for (const o of tagged.shell) o.visible = shellCb.checked;
  for (const o of tagged.hood) o.visible = hoodCb.checked;
  for (const o of tagged.millref) o.visible = millref.checked;
  // coil off (the default, as with no power): the springs hold the armature STROKE back toward the output (-W)
  for (const o of tagged.armature) o.position.z = coil.checked ? 0 : -STROKE;
  // the return springs stay seated on the bushes and follow the washers: released they are STROKE longer (toward -W)
  if (layout.spring_base_w !== undefined) {
    const s = coil.checked ? 1 : (layout.spring_len_engaged + STROKE) / layout.spring_len_engaged;
    for (const o of tagged.springs) { o.scale.z = s; o.position.z = layout.spring_base_w * (1 - s); }
  }
  // the door swings down about its hinge along the back bottom edge (W); its front side drops, it hangs at the back
  if (doorPivot.userData.ready) {
    for (const m of doorPivot.children) m.position.set(-doorPivot.position.x, -doorPivot.position.y, 0);
    doorPivot.rotation.z = doorCb.checked ? -THREE.MathUtils.degToRad(95) : 0;
  }
}
for (const el of ids) el.addEventListener("change", applyToggles);
for (const cb of document.querySelectorAll("[data-group]")) cb.addEventListener("change", () => { groups[cb.dataset.group].visible = cb.checked; });
function frame(objs) {
  const box = new THREE.Box3();
  for (const o of objs) if (o.visible) box.expandByObject(o);
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() / 2;
  const d = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.25;
  controls.target.copy(c);
  camera.position.copy(c).add(new THREE.Vector3(0.85, -0.45, 0.38).normalize().multiplyScalar(d));
  camera.updateProjectionMatrix();
}
for (const b of document.querySelectorAll("[data-view]"))
  b.addEventListener("click", () => frame(b.dataset.view === "all" ? Object.values(groups) : [groups[b.dataset.view]]));
camera.position.set(200, -1200, 700); controls.target.set(100, 0, 0);
const iv = setInterval(() => { if (loaded >= pending && pending > 0) { clearInterval(iv); frame(Object.values(groups)); } }, 200);
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------------------------------------------------------------- click to identify
const info = document.getElementById("info");
const ray = new THREE.Raycaster();
let picked = null, marker = null, downAt = null;
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function clearPick() {
  if (picked) { picked.material.emissive.setHex(picked.userData.emis); picked = null; }
  if (marker) { marker.parent.remove(marker); marker = null; }
}
function highlight(mesh) {
  if (!mesh.material.emissive) return;
  if (!mesh.userData.ownMat) { mesh.material = mesh.material.clone(); mesh.userData.ownMat = true; }   // GLB meshes share materials
  mesh.userData.emis = mesh.material.emissive.getHex();
  mesh.material.emissive.setHex(0x2a5a88);
  picked = mesh;
}
function showPart(key) {
  const [title, kind, text] = INFO[key] || [key, "", ""];
  info.innerHTML = `<h2>${esc(title)}</h2><div class="sub">${esc(kind)}</div><p>${esc(text)}</p>`;
}
function showPcbAt(local) {
  // local = point in the feed-unit frame -> PCB mm (x right, y down)
  const px = local.x - layout.pcb_x0, py = local.z - layout.pcb_w0;
  let best = null;
  for (const p of pcbParts)
    if (px >= p.x - 0.3 && px <= p.x + p.w + 0.3 && py >= p.y - 0.3 && py <= p.y + p.h + 0.3 && (!best || p.w * p.h < best.w * best.h))
      best = p;
  if (!best) {
    info.innerHTML = `<h2>Controller PCB</h2><div class="sub">4-layer, 100 × 100 mm · clicked at PCB (${px.toFixed(1)}, ${py.toFixed(1)}) mm</div>
      <p>Bare board here. Click a component to identify it.</p>
      <p class="hint">On the board: 36 V input and 5 V buck, the TMC5160 motor driver and its MOSFET bridges, the RP2040 with its
      flash and USB-C, the clutch coil driver, the hardware E-stop interlock, and the panel / encoder connectors.</p>`;
    return;
  }
  const rows = [["Part", best.value], ["Circuit", best.sheet], ["MPN", best.mpn], ["LCSC", best.lcsc], ["Footprint", best.footprint],
                ["Position", `PCB (${(best.x + best.w / 2).toFixed(1)}, ${(best.y + best.h / 2).toFixed(1)}) mm`]]
    .filter(r => r[1]).map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("");
  info.innerHTML = `<h2>${esc(best.ref)} · ${esc(best.value)}</h2><div class="sub">Controller PCB component</div>
    <p>${esc(best.role)}</p><table>${rows}</table>`;
  marker = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(best.w, 8, best.h)),
                                  new THREE.LineBasicMaterial({ color: 0x5fd0ff }));
  marker.position.set(layout.pcb_x0 + best.x + best.w / 2, layout.pcb_y + 5, layout.pcb_w0 + best.y + best.h / 2);
  groups.mill.add(marker);
}
function visible(o) { for (; o; o = o.parent) if (!o.visible) return false; return true; }
renderer.domElement.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;   // that was a drag
  const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), camera);
  const hit = ray.intersectObjects(Object.values(groups), true).find(h =>
    h.object.isMesh && h.object.userData.key && visible(h.object) && !(h.object.material.transparent && h.object.material.opacity < 0.5));
  clearPick();
  if (!hit) { info.innerHTML = `<h2>Click any part</h2><p class="hint">Nothing there. Click a part to identify it.</p>`; return; }
  highlight(hit.object);
  if (hit.object.userData.key === "pcb") showPcbAt(groups.mill.worldToLocal(hit.point.clone()));
  else showPart(hit.object.userData.key);
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
window.__viewer = { scene, camera, controls, groups, get loaded() { return loaded; }, get pending() { return pending; } };
</script>
</body>
</html>
