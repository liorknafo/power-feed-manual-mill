[package]
name = "feed-app"
version = "0.1.0"
edition = "2021"
description = "Mill power feed firmware for the Raspberry Pi Pico (RP2040), built on Embassy"
license = "MIT"

[dependencies]
feed-core = { path = "../feed-core" }
embassy-rp = { version = "0.10", features = ["rp2040", "time-driver", "critical-section-impl", "defmt", "unstable-pac"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8", features = ["defmt"] }
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
embedded-graphics = "0.8"
static_cell = "2"
fixed = "1"
embedded-hal = "1.0"
portable-atomic = { version = "1", features = ["critical-section"] }

[profile.release]
debug = 2
lto = true
opt-level = "s"
codegen-units = 1

[profile.dev]
opt-level = 1
